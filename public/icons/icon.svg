<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
    <defs>
      <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#f59e0b" />
        <stop offset="50%" stop-color="#ea580c" />
        <stop offset="100%" stop-color="#dc2626" />
      </linearGradient>
      <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="#fef08a" />
        <stop offset="100%" stop-color="#fde047" />
      </linearGradient>
      <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="15.36" stdDeviation="15.36" flood-opacity="0.3" flood-color="#000000"/>
      </filter>
    </defs>
    
    <!-- Background -->
    <rect width="512" height="512" rx="112.64" fill="url(#bgGrad)"/>
    
    <!-- Inner Card Shape -->
    <rect x="61.44" y="61.44" width="389.12" height="389.12" rx="81.92" fill="white" fill-opacity="0.15" stroke="rgba(255,255,255,0.3)" stroke-width="10.24"/>
    
    <!-- Main Character: 汉 (Hàn) -->
    <text x="50%" y="58%" font-family="'Noto Sans SC', 'PingFang SC', 'Microsoft YaHei', sans-serif" font-size="266.24" font-weight="900" fill="white" text-anchor="middle" dominant-baseline="middle" filter="url(#shadow)">
      汉
    </text>
    
    <!-- Accent badge 'HSK 1' -->
    <rect x="143.36" y="389.12" width="225.28" height="61.44" rx="30.72" fill="url(#goldGrad)"/>
    <text x="50%" y="424.96" font-family="sans-serif" font-size="38.4" font-weight="bold" fill="#9a3412" text-anchor="middle">
      HSK 1
    </text>
  </svg>